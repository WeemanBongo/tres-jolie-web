<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Preisliste – Kosmetik & Fusspflegepraxis Très Jolie</title>
  <meta name="description" content="Preisübersicht der Kosmetik & Fusspflegepraxis Très Jolie in Triesen, Liechtenstein: Gesichtsbehandlungen, Pediküre, Maniküre, Augenbrauen & Wimpern, Haarentfernung.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8a3a3a">
  <link rel="canonical" href="https://www.praxis-tres-jolie.li/preise">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Preisliste – Très Jolie">
  <meta property="og:description" content="Alle Behandlungen und Preise der Kosmetik & Fusspflegepraxis Très Jolie in Triesen, Liechtenstein.">
  <meta property="og:image" content="https://www.praxis-tres-jolie.li/images/background.jpg">
  <meta property="og:url" content="https://www.praxis-tres-jolie.li/preise">
  <meta property="og:locale" content="de_CH">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="/main-style.css">

  <style>
    /* Seitenspezifisch: Preisliste */
    header {
      padding: 100px 20px 60px;
    }

    .price-list {
      max-width: 900px;
      margin: auto;
    }

    .price-category {
      margin-bottom: 65px;
    }

    .price-category h3 {
      font-family: 'Playfair Display', serif;
      color: var(--wine);
      font-size: 1.6rem;
      border-bottom: 1px solid var(--rose);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .category-description {
      font-size: 0.95rem;
      color: #5f5f5f;
      margin-bottom: 28px;
      max-width: 760px;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px dashed #d6c8c0;
      transition: background-color 0.2s ease;
    }

    .price-item:hover {
      background-color: rgba(199, 163, 163, 0.08);
    }

    .price-text {
      max-width: 75%;
    }

    .price-text strong {
      display: block;
      font-weight: 500;
    }

    .item-description {
      font-size: 0.9rem;
      color: #666;
      margin: 6px 0 4px;
    }

    .duration {
      font-size: 0.85rem;
      color: #777;
    }

    .price-value {
      font-weight: 500;
      color: var(--wine);
      white-space: nowrap;
    }

    .price-list-status {
      text-align: center;
      color: #777;
      font-style: italic;
      padding: 30px 0;
    }

    @media (max-width: 700px) {
      header {
        padding: 70px 16px 40px;
      }

      .price-category h3 {
        font-size: 1.35rem;
      }

      .category-description {
        font-size: 0.9rem;
      }

      .price-item {
        flex-direction: column;
        gap: 6px;
      }

      .price-text {
        max-width: 100%;
      }

      .price-value {
        font-size: 1rem;
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="/" class="home-btn">← Home</a>
  <img src="/images/logo.png" alt="Très Jolie Logo" class="header-logo" width="280" height="168">
  <h1>Pflegeangebot & Preisübersicht</h1>
</header>

<main>
  <section>
    <div id="price-list" class="price-list">
      <p class="price-list-status">Preisliste wird geladen …</p>
    </div>
  </section>
</main>

<footer>
  © 2026 Kosmetik & Fusspflegepraxis – Très Jolie - Triesen - modern · natürlich · schön 🦋
</footer>

<script>
  const container = document.getElementById('price-list');

  fetch('/data/preisliste.csv')
    .then(res => {
      if (!res.ok) throw new Error('Preisliste konnte nicht geladen werden');
      return res.text();
    })
    .then(text => {
      const rows = text.trim().split('\n').slice(1);
      const categories = {};

      rows.forEach(row => {
        if (!row.trim()) return;

        const matches = row.match(/(".*?"|[^",\n]+)(?=\s*,|\s*$)/g);
        if (!matches) return;
        const values = matches.map(v => v.replace(/(^"|"$)/g, ''));

        const [category, categoryDesc, name, itemDesc, duration, price] = values;
        if (!category || !name) return;

        if (!categories[category]) {
          categories[category] = {
            description: categoryDesc || '',
            items: []
          };
        }

        categories[category].items.push({ name, itemDesc, duration, price });
      });

      const categoryNames = Object.keys(categories);
      if (categoryNames.length === 0) {
        container.innerHTML = '<p class="price-list-status">Aktuell ist keine Preisliste hinterlegt. Bitte kontaktiere uns direkt.</p>';
        return;
      }

      container.innerHTML = '';
      categoryNames.forEach(category => {
        const data = categories[category];
        const block = document.createElement('div');
        block.className = 'price-category';

        block.innerHTML = `
          <h3>${category}</h3>
          ${data.description ? `<p class="category-description">${data.description}</p>` : ``}
        `;

        data.items.forEach(item => {
          const priceLabel = item.price ? `CHF ${item.price}` : 'auf Anfrage';
          block.innerHTML += `
            <div class="price-item">
              <div class="price-text">
                <strong>${item.name}</strong>
                ${item.itemDesc ? `<div class="item-description">${item.itemDesc}</div>` : ``}
                ${item.duration ? `<div class="duration">⏱ ${item.duration}</div>` : ``}
              </div>
              <div class="price-value">${priceLabel}</div>
            </div>
          `;
        });

        container.appendChild(block);
      });
    })
    .catch(err => {
      console.error(err);
      container.innerHTML = '<p class="price-list-status">Die Preisliste konnte nicht geladen werden. Bitte versuche es später erneut oder kontaktiere uns direkt.</p>';
    });
</script>

</body>
</html>
